services:
  db:
    image: postgres:16-alpine
    container_name: ogoat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogoat
      POSTGRES_PASSWORD: ogoat
      POSTGRES_DB: ogoat
    ports:
      - "5433:5432"
    volumes:
      - ogoat_pgdata:/var/lib/postgresql/data

volumes:
  ogoat_pgdata:
